name: Signed alpha release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'New alpha tag, for example v0.1.0-alpha.1'
        required: true
        default: v0.1.0-alpha.1
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Require successful checks on this commit and validate tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]] || exit 1
          for workflow in android.yml backend.yml encryption.yml; do
            status=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$GITHUB_SHA&per_page=1" --jq '.workflow_runs[0].conclusion')
            test "$status" = success || { echo "Checks have not passed: $workflow"; exit 1; }
          done
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build with existing authorized signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" && test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Permanent signing has not been configured"; exit 1; }
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/messenger.p12"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          ./gradlew --no-daemon assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/private-messenger-alpha.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs dist/private-messenger-alpha.apk > dist/APK-SIGNING-CERTIFICATE.txt
          git archive --format=zip --output=dist/server-and-instructions.zip HEAD server README.md SECURITY.md
          git archive --format=zip --output=dist/source.zip HEAD
          cd dist
          sha256sum *.apk *.zip APK-SIGNING-CERTIFICATE.txt > SHA256SUMS
      - name: Publish alpha
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Experimental alpha: Android E2EE messenger with self-hosted Matrix server.
          Read README.md and SECURITY.md before deploying. No independent security audit or background push yet.
          APK, complete source, Docker server package and SHA-256 checksums are attached.
          NOTES
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "Private Messenger $TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease
