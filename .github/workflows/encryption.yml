name: End-to-end integration
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  encryption:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Create isolated test server
        run: |
          python3 server/setup.py --domain ci.invalid --url http://10.0.2.2:8088 --test
          docker compose -f server/compose.yml up -d --build --wait --wait-timeout 240
      - name: Check server and privacy of registration
        run: python3 server/tests/smoke.py
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Verify cloud messaging, history and multi-device login on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb logcat -c
            ./gradlew --no-daemon connectedE2eAndroidTest || { adb logcat -d -v time > android-test-logcat.txt; exit 1; }
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: encryption-test-reports
          path: |
            app/build/reports/androidTests
            android-test-logcat.txt
          retention-days: 14
      - name: Stop isolated test services
        if: always()
        run: docker compose -f server/compose.yml down -v
